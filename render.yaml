# Render Blueprint for the SENTINEL backend (the frontend is deployed to Netlify, see netlify.toml).
#
# The image seeds the deterministic synthetic world and trains the models at build time
# (backend/Dockerfile.render) and uses SQLite inside the container, so the free plan works:
# the disk is ephemeral, and every start restores the same clean demo state, shifted to today.
# Optional: switch DATABASE_URL to a managed PostgreSQL database for persistent data.
services:
  - type: web
    name: sentinel-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile.render
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://sentinel-payment-risk.netlify.app
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: GROQ_API_KEY
        sync: false
