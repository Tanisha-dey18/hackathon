# Render Blueprint: backend (Docker web service) + PostgreSQL + static frontend.
databases:
  - name: sentinel-db
    plan: free
    databaseName: sentinel
    user: sentinel

services:
  - type: web
    name: sentinel-api
    runtime: docker
    rootDir: backend
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: sentinel-db, property: connectionString }
      - key: JWT_SECRET
        generateValue: true
      - key: APP_ENV
        value: production
      - key: CORS_ORIGINS
        value: https://sentinel-web.onrender.com
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: SEED_PASSWORD
        sync: false

  - type: web
    name: sentinel-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://sentinel-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
